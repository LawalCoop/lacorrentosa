    position: relative;
    z-index: 5;

  /* ═══ MAPA de compras comunitarias ═══ */
  .mapa-hud {
    background: rgba(26, 20, 50, 0.85);

    border-radius: 4px;
  }
  .mapa-instr {
    font-family: var(--f-mono);
    font-size: 0.95rem;
    color: var(--cream-1);
    text-align: center;
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }
  .mapa-stats {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: var(--ink);
    border: 2px solid var(--cream-2);
    padding: 0.3rem 0.6rem;
    border-radius: 12px;
    font-family: var(--f-pixel);
    font-size: 0.55rem;
    color: var(--cream-1);
    letter-spacing: 0.5px;
  }
  .stat-pill.amber {
    border-color: var(--neon-amber);
    color: var(--neon-amber);
  }
  .stat-pill b {
    color: var(--neon-amber);
    font-weight: normal;
    font-size: 0.7rem;
  }
  .stat-pill.amber b { color: #fff5d0; }

  .mapa-vla {
    margin: 0.4rem 0;
    border: 3px solid var(--ink);
    box-shadow: inset 0 0 0 2px var(--cream-2), 0 6px 0 rgba(0, 0, 0, 0.4);
    border-radius: 4px;
    overflow: hidden;
    background: #1d6b54;
  }
  .mapa-svg {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .compra-place { cursor: pointer; }
  .compra-place .casita {
    transform-box: fill-box;
    transform-origin: center center;
    filter: grayscale(1) brightness(0.55);
    transition: filter 0.5s ease, transform 0.3s ease;
  }
  .compra-place:hover .casita {
    transform: translateY(-1px) scale(1.05);
    filter: grayscale(0.5) brightness(0.8);
  }
  .compra-place.activated .casita {
    filter: drop-shadow(0 0 3px #ffd97a);
  }
  .compra-place.just-popped .casita {
    animation: place-popped 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes place-popped {
    0%   { transform: scale(1) translateY(0); }
    25%  { transform: scale(1.45) translateY(-6px); }
    55%  { transform: scale(1.15) translateY(-2px); }
    100% { transform: scale(1) translateY(0); }
  }
  .compra-place.activated .halo {
    opacity: 0.55;
    animation: halo-pulse 2s ease-in-out infinite;
  }
  @keyframes halo-pulse {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.65; }
  }
  .compra-place.activated .check {
    opacity: 1;
    animation: check-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes check-pop {
    from { opacity: 0; transform: scale(0); }
    to   { opacity: 1; transform: scale(1); }
  }
  .compra-place.just-popped .ton-pop {
    animation: ton-fly 1.2s ease-out forwards;
  }
  @keyframes ton-fly {
    0%   { opacity: 0; transform: translate(0, 16px) scale(0.6); }
    20%  { opacity: 1; transform: translate(0, 10px) scale(1.2); }
    80%  { opacity: 1; transform: translate(0, -10px) scale(1); }
    100% { opacity: 0; transform: translate(0, -16px) scale(0.9); }
  }

  .lugar-label {
    font-family: var(--f-pixel);
    font-size: 4.5px;
    fill: #fff5d0;
    letter-spacing: 0.3px;
  }
  .compra-place.activated .lugar-label { fill: #ffd97a; }
  .ton-text {
    font-family: var(--f-pixel);
    font-size: 6px;

    stroke: var(--ink);

    0%   { transform: translateY(0); }
    20%  { transform: translateY(-26px) scale(1.06, 0.94); }
    40%  { transform: translateY(0)     scale(0.96, 1.04); }
    55%  { transform: translateY(-12px) scale(1.03, 0.97); }
    70%  { transform: translateY(0); }
    100% { transform: translateY(0); }

    35%      { transform: translateY(-8px); }
    50%      { transform: translateY(-4px); }
    75%      { transform: translateY(-8px); }
  }
  .speech-bubble {
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--cream-1, #fff5d0);
    border: 2px solid var(--ink, #1a1432);
    border-radius: 10px;
    padding: 4px 10px;
    font-family: var(--f-pixel, 'Press Start 2P', monospace);
    font-size: 0.55rem;
    color: var(--ink, #1a1432);
    line-height: 1;
    white-space: nowrap;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    animation: bubble-pop 0.25s ease-out, bubble-float 1.4s ease-in-out infinite 0.25s;
    z-index: 6;
    pointer-events: none;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    width: 8px;
    height: 8px;
    background: var(--cream-1, #fff5d0);
    border-right: 2px solid var(--ink, #1a1432);
    border-bottom: 2px solid var(--ink, #1a1432);
    transform: translateX(-50%) rotate(45deg);
  }
  .speech-bubble .dot { display: inline-block; opacity: 0.3; transition: opacity 0.1s; }
  .speech-bubble .dot:nth-child(1) { animation: dot-blink 1.2s steps(1) infinite; }
  .speech-bubble .dot:nth-child(2) { animation: dot-blink 1.2s steps(1) infinite 0.4s; }
  .speech-bubble .dot:nth-child(3) { animation: dot-blink 1.2s steps(1) infinite 0.8s; }
  @keyframes dot-blink {
    0%, 50%       { opacity: 1; }
    50.01%, 100%  { opacity: 0.25; }
  }
  @keyframes bubble-pop {
    from { transform: translateX(-50%) scale(0); opacity: 0; }
    to   { transform: translateX(-50%) scale(1); opacity: 1; }
  }
  @keyframes bubble-float {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-2px); }
  }

  .virus-bug.v-d { top: 28%; right: 22%; animation: virus-float-d 5.5s ease-in-out infinite; }
  .virus-bug.v-e { top: 2%;  left: 45%; animation: virus-float-e 4s ease-in-out infinite; }

  @keyframes virus-float-a {
    0%,100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(20px, -8px) rotate(90deg); }
    50% { transform: translate(8px, 16px) rotate(180deg); }
    75% { transform: translate(-12px, 4px) rotate(270deg); }

  @keyframes virus-float-b {
    0%,100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(-16px, 12px) rotate(-120deg); }
    66% { transform: translate(8px, -10px) rotate(-240deg); }
  }
  @keyframes virus-float-c {
    0%,100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(14px, -18px) rotate(360deg); }
  }
  @keyframes virus-float-d {
    0%,100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-10px, -14px) rotate(90deg); }
    75% { transform: translate(14px, 8px) rotate(-90deg); }

  @keyframes virus-float-e {
    0%,100% { transform: translate(0, 0) rotate(0deg); }

<!-- ═════════ Desktop: encuadrar el juego en un "marco mobile" vertical ═════════
     En desktop ancho activamos modo frame: el body queda oculto excepto el iframe
     que carga el mismo archivo con ?frame=1 (para evitar loop infinito). Así el juego
     se renderiza como mobile vertical adentro del frame y el desktop muestra los
     costados decorativos. */ -->
<script>
(function(){
  try {
    var url = new URL(window.location.href);
    var inFrame = url.searchParams.get('frame') === '1' || window.self !== window.top;
    if (inFrame) return;
    if (window.innerWidth < 900 || window.innerHeight < 700) return;
    window._MOBILE_FRAME_MODE = true;
    document.documentElement.classList.add('mobile-frame-mode');
    // Insertar el iframe apenas el body esté listo
    document.addEventListener('DOMContentLoaded', function(){
      document.body.classList.add('mobile-frame-mode');
      var frame = document.createElement('iframe');
      frame.src = 'index.html?frame=1';
      frame.title = 'La Correntosa · juego mobile';
      frame.allow = 'autoplay';
      frame.className = 'mobile-frame-iframe';
      document.body.appendChild(frame);
    });
  } catch (e) {}
})();
</script>
<style>
  /* modo frame mobile: ocultar TODO el contenido del body excepto el iframe */
  html.mobile-frame-mode, html.mobile-frame-mode body {
    background: #0c0a26 !important;
    background-image: radial-gradient(ellipse at 50% 50%, #1f1d3a 0%, #0c0a26 70%) !important;
    overflow: hidden !important;
  }
  body.mobile-frame-mode { margin: 0; min-height: 100dvh; display: block; }
  body.mobile-frame-mode > *:not(.mobile-frame-iframe) { display: none !important; }
  body.mobile-frame-mode > script,
  body.mobile-frame-mode > style { display: none !important; }
  .mobile-frame-iframe {
    display: block;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 430px;
    height: 900px;
    max-width: 100vw;
    max-height: 100dvh;
    border: 6px solid #1f1d3a;
    border-radius: 32px;
    box-shadow:
      0 24px 60px rgba(0,0,0,0.6),
      inset 0 0 0 2px #45dec0,
      0 0 0 1px #ffd97a;
    background: #1a1432;
    image-rendering: pixelated;
  }
</style>

function statsRunStart() { if (!stats.runStartedAt) { stats.runStartedAt = Date.now(); saveStats(); } }

  if (!stats.runStartedAt) return;

  stats.runStartedAt = 0;
  saveStats();

let _currentBg = null;
function setWorldBg(name) {
  if (_currentBg === name) return;
  const host = document.getElementById('world-bg');
  if (!host) return;
  if (_currentBg === null) {
    host.innerHTML = renderBg(name);
    host.style.opacity = '1';
    _currentBg = name;
    attachWorldBgHandlers();
    return;
  }
  _currentBg = name;
  host.style.opacity = '0';
  setTimeout(() => {
    host.innerHTML = renderBg(name);
    host.style.opacity = '1';
    attachWorldBgHandlers();
  }, 220);
}

function attachWorldBgHandlers() {
  const host = document.getElementById('world-bg');
  if (!host) return;
  host.querySelectorAll('.compra-place').forEach(el => {
    el.addEventListener('click', () => onCompraClick(el));
  });
}

function onCompraClick(el) {
  if (game.scene !== 'compras-mapa') return;
  const id = el.dataset.place;
  if (!game.compras || game.compras[id]) return;
  const lugar = COMPRAS_LUGARES.find(l => l.id === id);
  if (!lugar) return;
  game.compras[id] = true;
  saveGame();
  playSfx('correct');
  el.classList.add('activated', 'just-popped');
  setTimeout(() => el.classList.remove('just-popped'), 700);
  // arrancó: ocultar dedito y CTA hint
  document.body.classList.add('compras-started');
  // estallido de frutitas
  spawnFrutitas(el);

  const total = COMPRAS_LUGARES.filter(l => game.compras[l.id]).reduce((s, l) => s + l.ton, 0);
  const count = COMPRAS_LUGARES.filter(l => game.compras[l.id]).length;
  const stage = document.getElementById('stage');
  const tonEl = stage.querySelector('.mapa-ton');
  const cntEl = stage.querySelector('.mapa-count');
  if (tonEl) tonEl.textContent = total.toFixed(1);
  if (cntEl) cntEl.textContent = count + '/' + COMPRAS_LUGARES.length;

  if (count === COMPRAS_LUGARES.length) {
    mostrarComprasContinuar();
    setTimeout(() => playSfx('victory'), 300);
  }
}

const FRUTITAS = ['🍎','🍅','🥕','🍐','🍊','🥬','🍓','🌽','🍇','🥒','🍑','🥦'];
function spawnFrutitas(placeEl) {
  const rect = placeEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const burst = document.createElement('div');
  burst.className = 'frutitas-burst';
  burst.style.left = cx + 'px';
  burst.style.top = cy + 'px';
  document.body.appendChild(burst);
  const N = 9;
  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
    const dist = 70 + Math.random() * 50;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 25;
    const fall = 60 + Math.random() * 40;
    const f = document.createElement('span');
    f.className = 'frutita';
    f.textContent = FRUTITAS[Math.floor(Math.random() * FRUTITAS.length)];
    f.style.setProperty('--dx', dx + 'px');
    f.style.setProperty('--dy', dy + 'px');
    f.style.setProperty('--fall', fall + 'px');
    f.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    f.style.animationDelay = (i * 25) + 'ms';
    burst.appendChild(f);
  }
  setTimeout(() => burst.remove(), 1700);
}

function mostrarComprasContinuar() {
  const stage = document.getElementById('stage');
  const slot = stage.querySelector('.mapa-cta-slot');
  const name = stage.querySelector('#mapa-dialog .dialog-name');
  const txt = stage.querySelector('#mapa-dialog .dialog');
  if (name) name.textContent = '★ NARRADOR';
  if (txt) {
    const cierre = 'En casi 2 años de compras comunitarias:\n\n· miles de pedidos organizados entre vecines\n· decenas de toneladas de alimento agroecológico\n· cientos de familias encontrándose en estos espacios.\n\nEl proyecto pide dar un paso más...';
    txt.dataset.text = cierre;
    txt.removeAttribute('data-played');
    delete txt.dataset.played;
    txt.textContent = '';
    txt.style.whiteSpace = 'pre-line';
    runTypewriter(txt);
    txt.addEventListener('tw-done', () => {
      if (slot && !slot.querySelector('button')) {
        slot.innerHTML = '<button class="btn-arcade primary" data-next="figura-charla1">▶ Continuar</button>';
        const btn = slot.querySelector('button');
        btn.addEventListener('click', () => { setScene('figura-charla1'); playSfx('click'); });
      }
    }, { once: true });
  }
}

        const y=295-((i*5)%6);
        const r=8+(i%4)*2.5;
        const wob1x=x-r*0.45+((i*3)%4)*0.5;
        const wob1y=y-r*0.6;
        const wob2x=x+r*0.4-((i*5)%4)*0.4;
        const wob2y=y-r*0.5+((i*7)%3)*0.5;
        arbs.push(`
          <ellipse cx="${x}" cy="${y+1}" rx="${r}" ry="${r*0.78}" fill="#3a6647" opacity="0.92"/>
          <ellipse cx="${wob1x}" cy="${wob1y}" rx="${r*0.55}" ry="${r*0.5}" fill="#4d7d5a" opacity="0.85"/>
          <ellipse cx="${wob2x}" cy="${wob2y}" rx="${r*0.45}" ry="${r*0.4}" fill="#3a6647" opacity="0.9"/>
        `);
      }
      return arbs.join('');
    })()}
    <!-- pasto verde claro adelante · 305 → 480 -->
    <rect x="0" y="305" width="360" height="175" fill="#a4cc78"/>
    <!-- camino de tierra cruzando -->
    <path d="M -10 410 Q 180 390 370 420 L 370 480 L -10 480 Z" fill="#d8b97e" opacity="0.55"/>
    <!-- arbolitos del bosquecito a los costados (más cerca) -->
    ${(()=>{
      const arbs=[];
      // izquierda
      for(let i=0;i<5;i++){
        const x=15+i*22+((i*5)%4);
        const y=330+(i%2)*12;
        const h=22+(i%3)*5;
        arbs.push(`
          <ellipse cx="${x}" cy="${y+h+2}" rx="${h*0.55}" ry="${h*0.18}" fill="#000" opacity="0.25"/>
          <rect x="${x-2}" y="${y+h-2}" width="4" height="8" fill="#5a3216"/>
          <ellipse cx="${x}" cy="${y+h*0.5}" rx="${h*0.55}" ry="${h*0.6}" fill="#4d8c4d"/>
          <ellipse cx="${x-h*0.2}" cy="${y+h*0.35}" rx="${h*0.3}" ry="${h*0.3}" fill="#6ba661" opacity="0.8"/>
        `);
      }
      // derecha
      for(let i=0;i<5;i++){
        const x=255+i*22+((i*5)%4);
        const y=330+((i+1)%2)*12;
        const h=22+(i%3)*5;
        arbs.push(`
          <ellipse cx="${x}" cy="${y+h+2}" rx="${h*0.55}" ry="${h*0.18}" fill="#000" opacity="0.25"/>
          <rect x="${x-2}" y="${y+h-2}" width="4" height="8" fill="#5a3216"/>
          <ellipse cx="${x}" cy="${y+h*0.5}" rx="${h*0.55}" ry="${h*0.6}" fill="#4d8c4d"/>
          <ellipse cx="${x-h*0.2}" cy="${y+h*0.35}" rx="${h*0.3}" ry="${h*0.3}" fill="#6ba661" opacity="0.8"/>
        `);
      }
      return arbs.join('');
    })()}
    <!-- florecitas en el pasto -->
    ${(()=>{
      const fls=[];
      for(let i=0;i<14;i++){
        const x=30+(i*32+11)%320;
        const y=350+(i*13+5)%110;
        const c=['#ff6b9a','#ffd97a','#fff'][i%3];
        fls.push(`<circle cx="${x}" cy="${y}" r="2.2" fill="${c}"/><circle cx="${x}" cy="${y}" r="1" fill="#ffd97a"/>`);
      }
      return fls.join('');
    })()}
  </svg>`;
}

/* Pastito con plantitas (fondo natural simple para la escena boca en boca) */

  return `

      <linearGradient id="pp-pasto" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#58e87e"/>

    <!-- pastitos individuales -->
    <g fill="#1d6b54" opacity="0.7">

        const x = (i * 23) % 360 + (i % 3) * 7;

let _musicResumeOnLeave = false;
function setScene(name) {
  // al entrar al mapa desde otra escena, garantizar que arranca limpio
  if (name === 'compras-mapa' && game.scene !== 'compras-mapa') {
    resetCompras();
  }
  if (name === 'crece-bocaenboca' && game.scene !== 'crece-bocaenboca') {
    game.bocaTaps = 0;
    game.bocaActivados = [];
  }
  if (name === 'compras-eleccion' && game.scene !== 'compras-eleccion') {
    game.comprasEleccionIdx = 0;
    game.comprasEleccionAciertos = 0;
    game.comprasEleccionStarted = false;
  }
  if (name === 'crece-excedente' && game.scene !== 'crece-excedente') {
    game.precioFinal = 8500;
    game.precioTocado = false;
    game.excedenteStarted = false;
  }
  if (name === 'despensa-municipio' && game.scene !== 'despensa-municipio') {
    game.despensaMuniFirmas = [];
    game.despensaMuniIdx = 0;
    game.despensaMuniAbierto = false;
  }
  if (name === 'despensa-provincia' && game.scene !== 'despensa-provincia') {
    game.despensaProvinciaPaso = 0;
  }
  if (name === 'crece-reinversion' && game.scene !== 'crece-reinversion') {
    // el excedente inicial deriva del precio final que el user eligió en la escena anterior
    // (se asume un volumen mensual de venta · simplificado: × 50 unidades)
    const excedentePorKg = Math.max(0, (game.precioFinal || 10000) - COSTO_PRODUCTOR - COSTO_OPERATIVO);
    game.reinvExcedente = excedentePorKg * 50;
    game.reinvAsociados = 200;
    game.reinvCompras = { stock: false, balanzas: false, compostera: false, deck: false };
    game.reinvStarted = false;
  }
  // si estoy saliendo de un chapter y la música estaba sonando antes, retomarla
  const cur = SCENES[game.scene];
  if (cur && cur.type === 'chapter' && _musicResumeOnLeave) {
    if (typeof startMusic === 'function') startMusic();
    _musicResumeOnLeave = false;
  }
  game.scene = name;
  saveGame();
  // ajustar el banco musical según la escena (himno argentino · despensa-nacion · himno neuquén · despensa-provincia)
  if (typeof setMusicForScene === 'function') setMusicForScene(name);
  render();
  window.scrollTo(0, 0);
  // si entro a un chapter: pausar música, fanfare
  const next = SCENES[name];
  if (next && next.type === 'chapter') {
    if (typeof musicaRunning !== 'undefined' && musicaRunning) {
      _musicResumeOnLeave = true;
      stopMusic();
    }
    setTimeout(() => playChapterFanfare(), 150);
  }
}

function render() {
  const stage = document.getElementById('stage');
  const sc = SCENES[game.scene];
  if (!sc) { stage.innerHTML = '<div class="panel">Escena no encontrada.</div>'; return; }

  setWorldBg(SCENE_BG[game.scene] || 'aldea-noche');
  document.body.classList.toggle('scene-mapa', game.scene === 'compras-mapa');
  document.body.classList.toggle('scene-bossfight', game.scene === 'boss-fight');
  document.body.classList.toggle('scene-bossredimido', game.scene === 'boss-redimido');
  document.body.classList.toggle('scene-municipio', game.scene === 'despensa-municipio');
  document.body.classList.toggle('scene-cosecha', game.scene === 'crece-excedente' && !game.excedenteStarted);
  document.body.classList.toggle('scene-llegada', game.scene === 'crece-reinversion' && !game.reinvStarted);
  document.body.classList.remove('compras-ready', 'compras-started');

  if (sc.type === 'title') stage.innerHTML = renderTitle();
  else if (sc.type === 'chapter') stage.innerHTML = renderChapter(sc);
  else if (sc.type === 'dialog') stage.innerHTML = renderDialog(sc);
  else if (sc.type === 'crecimiento') { stage.innerHTML = renderCrecimiento(); animateCrecimiento(); }
  else if (sc.type === 'crece-bocaenboca') { stage.innerHTML = renderBocaEnBoca(); }
  else if (sc.type === 'crece-excedente') { stage.innerHTML = renderCreceExcedente(); }
  else if (sc.type === 'crece-reinversion') { stage.innerHTML = renderCreceReinversion(); }
  else if (sc.type === 'despensa-respaldo') { stage.innerHTML = renderDespensaRespaldo(); }
  else if (sc.type === 'despensa-nacion') { stage.innerHTML = renderDespensaNacion(); }
  else if (sc.type === 'despensa-municipio') { stage.innerHTML = renderDespensaMunicipio(); }
  else if (sc.type === 'despensa-provincia') { stage.innerHTML = renderDespensaProvincia(); }
  else if (sc.type === 'despensa-cierre') { stage.innerHTML = renderDespensaCierre(); }
  else if (sc.type === 'choice') stage.innerHTML = renderChoice(sc);
  else if (sc.type === 'productores') { stage.innerHTML = renderProductores(); }
  else if (sc.type === 'red-coop') { stage.innerHTML = renderRedCoop(); }
  else if (sc.type === 'compras-eleccion') { stage.innerHTML = renderComprasEleccion(); }
  else if (sc.type === 'compras-mapa') { stage.innerHTML = renderComprasMapa(); }
  else if (sc.type === 'boss-intro') { stage.innerHTML = renderBossIntro(); }
  else if (sc.type === 'boss-fight') { stage.innerHTML = renderBossFight(); }
  else if (sc.type === 'boss-redimido') { stage.innerHTML = renderBossRedimido(); }
  else if (sc.type === 'victory') { stage.innerHTML = renderVictory(); }

  attachHandlers();

  // setup específico boss-aparece: bubble + bobeo en quien habla cada página
  // (frases 1 y 3 las dice el villano principal; la 2da la dice un secuaz)
  if (game.scene === 'boss-aparece') {
    const tw = stage.querySelector('.dialog.tw');
    const villain = document.getElementById('villain-principal');
    const secuaz = document.getElementById('villain-secuaz-der');
    if (tw && villain && secuaz) {
      const limpiar = (el) => {
        el.classList.remove('talker');
        const b = el.querySelector('.speech-bubble');
        if (b) b.remove();
      };
      const activar = (el) => {
        el.classList.add('talker');
        if (!el.querySelector('.speech-bubble')) {
          const b = document.createElement('div');
          b.className = 'speech-bubble';
          b.innerHTML = '<span class="dot">·</span><span class="dot">·</span><span class="dot">·</span>';
          el.appendChild(b);
        }
      };
      tw.addEventListener('tw-page-start', (e) => {
        const idx = (e.detail && e.detail.pageIdx) || 0;
        if (idx === 1) { limpiar(villain); activar(secuaz); }
        else            { limpiar(secuaz); activar(villain); }
      });
      tw.addEventListener('tw-done', () => { limpiar(villain); limpiar(secuaz); }, { once: true });
    }
  }

  // setup específico boss-redimido: bubble + bobeo al que está hablando en cada página
  // (debe registrarse ANTES de runTypewriter para captar el evento de la primera página)
  if (game.scene === 'boss-redimido') {
    const tw = stage.querySelector('.dialog.tw');
    const boss = document.getElementById('encuentro-boss');
    const asoc = document.getElementById('encuentro-asoc');
    if (tw && boss && asoc) {
      const limpiar = (el) => {
        el.classList.remove('talker');
        const b = el.querySelector('.speech-bubble');
        if (b) b.remove();
      };
      const activar = (el) => {
        el.classList.add('talker');
        if (!el.querySelector('.speech-bubble')) {
          const b = document.createElement('div');
          b.className = 'speech-bubble';
          b.innerHTML = '<span class="dot">·</span><span class="dot">·</span><span class="dot">·</span>';
          el.appendChild(b);
        }
      };
      tw.addEventListener('tw-page-start', (e) => {
        const txt = (e.detail && e.detail.text) || '';
        if (txt.startsWith('EX-VILLANX')) { limpiar(asoc); activar(boss); }
        else if (txt.startsWith('ASOCIADXS')) { limpiar(boss); activar(asoc); }
      });
      tw.addEventListener('tw-done', () => {
        limpiar(boss); limpiar(asoc);
        // mostrar los botones SI/NO recién al terminar la ronda completa
        const actions = stage.querySelector('.ronda-actions');
        if (actions) actions.classList.remove('actions-hidden');
      }, { once: true });
    }
  }

  // typewriter en escenas con texto
  document.querySelectorAll('.tw').forEach(el => runTypewriter(el));

  // ═══ DIALOG SYSTEM v2 · paso 1 · comportamiento estándar para todos los dialog-box con typewriter ═══
  // 1) tap en cualquier parte del cuadro skipea/avanza el typewriter
  // 2) los botones quedan ocultos (.actions-hidden) hasta que termine el texto
  document.querySelectorAll('.dialog-box').forEach(box => {
    const tw = box.querySelector('.dialog.tw');
    if (!tw) return;
    const actions = box.querySelector('.dialog-actions');
    // los botones aparecen recién al terminar el typewriter (a menos que ya estén ocultos por otra lógica)
    if (actions) {
      actions.classList.add('actions-hidden');
      tw.addEventListener('tw-done', () => actions.classList.remove('actions-hidden'), { once: true });
    }
    // tap en el cuadro entero (no sobre botones) = skipea/avanza el typewriter
    box.addEventListener('click', (e) => {
      if (e.target.closest('button, a, input, textarea')) return;
      tw.click();
    });
  });

  // setup cierre reinversión: el botón Continuar aparece al terminar el typewriter
  if (game.scene === 'crece-reinversion') {
    const dlg = document.getElementById('reinv-dialog');
    if (dlg) {
      const tw = dlg.querySelector('.dialog.tw');
      const slot = dlg.querySelector('#reinv-cta');
      if (tw && slot) {
        tw.addEventListener('tw-done', () => {
          if (slot.querySelector('button')) return;
          slot.innerHTML = '<button class="btn-arcade primary" data-next="chapter3-intro">▶ Continuar</button>';
          const btn = slot.querySelector('button');
          btn.addEventListener('click', () => { setScene('chapter3-intro'); playSfx('click'); });
        }, { once: true });
      }
    }
  }

  // setup específico cierre de elección: el botón Continuar aparece sólo cuando termina la última página
  if (game.scene === 'compras-eleccion') {
    const finDialog = document.getElementById('eleccion-fin');
    if (finDialog) {
      const tw = finDialog.querySelector('.dialog.tw');
      const slot = finDialog.querySelector('#eleccion-fin-actions');
      if (tw && slot) {
        tw.addEventListener('tw-done', () => {
          slot.innerHTML = '<button class="btn-arcade primary" data-next="compras-mapa">▶ Continuar</button>';
          const btn = slot.querySelector('button');
          btn.addEventListener('click', () => { setScene('compras-mapa'); playSfx('click'); });
        }, { once: true });
      }
    }
  }

  // setup específico mapa: cuando termina el typewriter, habilitar clicks + mostrar CTA
  if (game.scene === 'compras-mapa') {
    const dialog = document.getElementById('mapa-dialog');
    if (dialog) {
      dialog.addEventListener('tw-done', () => {
        document.body.classList.add('compras-ready');
        // si ya estaba completo (estado guardado), mostrar continuar
        const compradosCount = COMPRAS_LUGARES.filter(l => game.compras[l.id]).length;
        if (compradosCount === COMPRAS_LUGARES.length) {
          mostrarComprasContinuar();
        }
      }, { once: true });

/* ═══ Mini-juego del excedente · ajustar precio final y ver desglose ═══ */
const COSTO_PRODUCTOR = 7000;    // lo que recibe el productor por kg
const COSTO_OPERATIVO = 2000;    // flete, gastos administrativos, gastos mutual
const PRECIO_MIN = 8500;
const PRECIO_MAX = 12500;
const PRECIO_PASO = 250;

function getExcedenteData() {
  let precio = game.precioFinal;
  // si el user nunca tocó los botones, siempre arrancar en el mínimo (en déficit)
  // esto sobreescribe cualquier valor viejo guardado en localStorage
  if (!game.precioTocado || precio < PRECIO_MIN || precio > PRECIO_MAX || precio == null) {
    precio = 8500;
    game.precioFinal = precio;
  }
  const productor = COSTO_PRODUCTOR;
  const operativo = COSTO_OPERATIVO;
  const excedente = precio - productor - operativo;
  const pctProductor = Math.max(0, productor / precio * 100);
  const pctOperativo = Math.max(0, operativo / precio * 100);
  const pctExcedente = excedente / precio * 100;
  let zona, mensaje, ok;
  if (excedente < 0) {
    zona = 'perdida';
    mensaje = 'A este precio estamos pagando con plata propia para sostener el circuito. No le podemos pagar al productor lo que cobra ni cubrir el flete. Así no llegamos a fin de mes.';
    ok = false;
  } else if (pctExcedente < 5) {
    zona = 'baja';
    mensaje = 'Llegamos justito a cubrir todo. No queda nada para arreglar la despensa, sumar más asociadxs ni para los meses flojos. Cualquier imprevisto y nos atrasamos.';
    ok = false;
  } else if (pctExcedente <= 15) {
    zona = 'ideal';
    mensaje = 'Así encontramos el equilibrio. Le pagábamos lo suyo a la productora, cubríamos el circuito y nos quedaba algo para crecer.\n\nVecines llegaban, pagaban buenos precios por alimentos increíbles, y el proyecto se sostenía.';
    ok = true;
  } else if (pctExcedente <= 25) {
    zona = 'alta';
    mensaje = 'Los precios subieron de más. Algunes vecines empiezan a preguntar: "¿no es caro acá?". El alimento debería ser para acercarlo a la gente, no para alejarlo.';
    ok = false;
  } else {
    zona = 'muy-alta';
    mensaje = 'Estamos cobrando lo mismo que un comercio. La mutual no es eso: nuestro fin es que el alimento sano llegue a quien lo necesita, no acumular. Bajá el precio.';
    ok = false;
  }
  return { precio, productor, operativo, excedente, pctProductor, pctOperativo, pctExcedente, zona, mensaje, ok };
}

/* ═══ Cierre del Capítulo 3 · Despensa frontal construida → zoom out con muchos asociadxs ═══ */
function renderDespensaCierre() {
  // generar muchos asociadxs alrededor de la despensa, en filas escalonadas (más al fondo = más chiquitos)
  const sprites = ['sp-v1','sp-v2','sp-v3','sp-v4','sp-v5','sp-v1-bb','sp-v2-bb','sp-v3-bb','sp-v4-bb'];
  // filas con buena separación · más espacio entre filas y delays más distribuidos
  const filas = [
    { y: 462, w: 44, count: 14, xrange: [380, 820], delayBase: 0.2 },
    { y: 495, w: 52, count: 18, xrange: [320, 880], delayBase: 1.5 },
    { y: 535, w: 60, count: 22, xrange: [240, 960], delayBase: 3.0 },
    { y: 570, w: 68, count: 24, xrange: [120, 1080], delayBase: 4.5 },
    { y: 612, w: 82, count: 28, xrange: [60,  1140], delayBase: 6.0 },
    { y: 660, w: 100, count: 32, xrange: [-40, 1240], delayBase: 7.5, conCorazones: true },
    { y: 712, w: 120, count: 36, xrange: [-120,1320], delayBase: 9.0, conCorazones: true },
  ];
  const asociadxs = [];
  let idx = 0;
  filas.forEach((f, fi) => {
    const step = (f.xrange[1] - f.xrange[0]) / (f.count - 1);
    for (let k = 0; k < f.count; k++) {
      // jitter pseudo-aleatorio (deterministicο, basado en idx) para que no queden equiespaciados ni en parejas
      const jitterX = ((idx * 7919) % 41) - 20;     // ±20 unidades en X
      const jitterY = ((idx * 4783) % 13) - 6;       // ±6 unidades en Y
      const jitterW = ((idx * 1597) % 7) - 3;        // ±3 unidades en width (variación de altura)
      const spriteJitter = ((idx * 2333) % sprites.length); // sprite más mezclado
      const delayJitter = ((idx * 911) % 100) / 100 * 0.8;  // delay 0-0.8s extra
      const x = f.xrange[0] + k * step + jitterX;
      asociadxs.push({
        x: x.toFixed(1),
        y: f.y + jitterY,
        w: f.w + jitterW,
        sp: sprites[spriteJitter],
        delay: (f.delayBase + delayJitter).toFixed(2),
        fila: fi,
        idx,
        conCorazones: !!f.conCorazones && (idx % 2 === 0),  // mitad de los de las filas con corazón llevan uno
      });
      idx++;
    }
  });

  return `
    <div class="cierre-stage">
      <svg class="cierre-svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <!-- gradient cordillera · OPACO arriba (tapa el arcoíris) y desvanece solo en la base -->
          <linearGradient id="cierreMontana" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#7a8aa4" stop-opacity="1"/>
            <stop offset="80%"  stop-color="#7a8aa4" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#7a8aa4" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <!-- ═══ FONDO BASE: lo provee el background CSS (cielo+pasto continuos sin línea de transición) ═══ -->
        <!-- El SVG queda con fondo transparente · todo el cielo/pasto viene del background del .cierre-stage -->

        <!-- ═══ ESCENA ÚNICA · todo en una composición centrada · zoom out la revela completa ═══ -->
        <g class="cierre-mundo">
          <!-- ─── NUBES Ghibli flotando en el cielo ─── -->
          <g class="cierre-nubes" fill="#fff8ec" opacity="0.92">
            <g class="cierre-nube cierre-nube-1">
              <ellipse cx="120" cy="80" rx="34" ry="13"/>
              <ellipse cx="98"  cy="76" rx="20" ry="11"/>
              <ellipse cx="142" cy="74" rx="16" ry="10"/>
              <ellipse cx="118" cy="68" rx="14" ry="8"/>
            </g>
            <g class="cierre-nube cierre-nube-2" opacity="0.85">
              <ellipse cx="380" cy="50" rx="26" ry="10"/>
              <ellipse cx="362" cy="48" rx="14" ry="8"/>
              <ellipse cx="396" cy="46" rx="12" ry="7"/>
            </g>
            <g class="cierre-nube cierre-nube-3" opacity="0.78">
              <ellipse cx="680" cy="100" rx="30" ry="11"/>
              <ellipse cx="660" cy="96" rx="18" ry="9"/>
              <ellipse cx="700" cy="92" rx="14" ry="8"/>
            </g>
            <g class="cierre-nube cierre-nube-4" opacity="0.85">
              <ellipse cx="950" cy="65" rx="28" ry="11"/>
              <ellipse cx="930" cy="62" rx="16" ry="8"/>
              <ellipse cx="966" cy="58" rx="12" ry="7"/>
            </g>
            <g class="cierre-nube cierre-nube-5" opacity="0.7">
              <ellipse cx="1080" cy="120" rx="22" ry="8"/>
              <ellipse cx="1064" cy="118" rx="13" ry="7"/>
            </g>
          </g>

          <!-- ─── AVES volando · siluetas en V que cruzan el cielo ─── -->
          <g class="cierre-aves" stroke="#1a2820" stroke-width="2" stroke-linecap="round" fill="none">
            <g class="cierre-ave cierre-ave-1">
              <path d="M -8 0 Q -4 -3 0 0 Q 4 -3 8 0"/>
            </g>
            <g class="cierre-ave cierre-ave-2">
              <path d="M -7 0 Q -3.5 -2.5 0 0 Q 3.5 -2.5 7 0" stroke-width="1.5"/>
            </g>
            <g class="cierre-ave cierre-ave-3">
              <path d="M -6 0 Q -3 -2 0 0 Q 3 -2 6 0" stroke-width="1.3"/>
            </g>
          </g>

          <!-- ─── ARCOÍRIS arriba en el cielo, detrás de las montañas (semicírculo) ─── -->
          <g class="cierre-arcoiris" aria-hidden="true" stroke-width="0">
            <path d="M 180 360 A 420 420 0 0 1 1020 360 L 996 360 A 396 396 0 0 0 204 360 Z" fill="#e85a3a" opacity="0.65"/>
            <path d="M 204 360 A 396 396 0 0 1 996 360 L 974 360 A 374 374 0 0 0 226 360 Z" fill="#f0a050" opacity="0.65"/>
            <path d="M 226 360 A 374 374 0 0 1 974 360 L 952 360 A 352 352 0 0 0 248 360 Z" fill="#f4d050" opacity="0.65"/>
            <path d="M 248 360 A 352 352 0 0 1 952 360 L 930 360 A 330 330 0 0 0 270 360 Z" fill="#7ac860" opacity="0.65"/>
            <path d="M 270 360 A 330 330 0 0 1 930 360 L 908 360 A 308 308 0 0 0 292 360 Z" fill="#5aa8d8" opacity="0.65"/>
            <path d="M 292 360 A 308 308 0 0 1 908 360 L 886 360 A 286 286 0 0 0 314 360 Z" fill="#9070c8" opacity="0.65"/>
          </g>

          <!-- ─── CORDILLERA NEVADA · gradient de opacidad para fundirse con el pasto sin línea ─── -->
          <path d="M 0 280 L 80 200 L 160 250 L 250 180 L 340 240 L 440 160 L 540 230 L 640 170 L 740 240 L 840 190 L 940 250 L 1040 200 L 1130 240 L 1200 220 L 1200 360 L 0 360 Z" fill="url(#cierreMontana)"/>
          <!-- nieve en las cimas -->
          <path d="M 245 185 L 250 180 L 260 200 L 254 205 Z M 435 165 L 440 160 L 450 180 L 444 185 Z M 635 175 L 640 170 L 650 190 L 644 195 Z M 835 195 L 840 190 L 850 210 L 844 215 Z" fill="#fff5f0" opacity="0.95"/>

          <!-- ─── MASA DE BOSQUE NATIVO · ATRÁS de las casas (se dibuja primero) ─── -->
          <g class="cierre-bosque">
            <!-- base sólida del bosque (verde oscuro) -->
            <rect x="0" y="335" width="1200" height="50" fill="#2c4a2c"/>
            <rect x="0" y="340" width="1200" height="45" fill="#3a5a36"/>
            <!-- copas orgánicas pegadas al rect base · forman masa continua sin gaps -->
            ${(() => {
              const copas = [];
              const verdes = ['#2c4a2c', '#34503a', '#3a5a36', '#42603e', '#385a3a'];
              for (let i = 0; i < 90; i++) {
                const x = (i * 14) % 1220 - 5;
                const y = 308 + ((i * 11) % 32);
                const rx = 16 + ((i * 7) % 14);
                const ry = 14 + ((i * 5) % 10);
                copas.push({ x, y, rx, ry, fill: verdes[i % verdes.length] });
              }
              return copas.map(c => `<ellipse cx="${c.x}" cy="${c.y}" rx="${c.rx}" ry="${c.ry}" fill="${c.fill}"/>`).join('');
            })()}
            <!-- segunda capa de copas (tonos más claros) · da volumen sin separarse -->
            ${(() => {
              const copas = [];
              const verdes = ['#3a5a36', '#42663e', '#4a6e42', '#3e5e3a'];
              for (let i = 0; i < 70; i++) {
                const x = 5 + (i * 18) % 1210;
                const y = 320 + ((i * 11) % 28);
                const rx = 14 + ((i * 5) % 12);
                const ry = 11 + ((i * 3) % 8);
                copas.push({ x, y, rx, ry, fill: verdes[i % verdes.length] });
              }
              return copas.map(c => `<ellipse cx="${c.x}" cy="${c.y}" rx="${c.rx}" ry="${c.ry}" fill="${c.fill}"/>`).join('');
            })()}
            <!-- highlights amarillo-verdes en las copas más altas (luz del atardecer) -->
            ${(() => {
              const highlights = [];
              for (let i = 0; i < 30; i++) {
                const x = 25 + (i * 41) % 1170;
                const y = 312 + ((i * 13) % 22);
                const rx = 6 + ((i * 3) % 5);
                const ry = 4;
                highlights.push({ x, y, rx, ry });
              }
              return highlights.map(h => `<ellipse cx="${h.x}" cy="${h.y}" rx="${h.rx}" ry="${h.ry}" fill="#5e8a4a" opacity="0.55"/>`).join('');
            })()}
            <!-- bosque lateral izquierdo (árboles más grandes adelante) -->
            ${(() => {
              const arboles = [];
              const verdes = ['#2c4a2c', '#3a5a36', '#4a6a3e', '#3e5e36'];
              for (let i = 0; i < 12; i++) {
                const x = -20 + ((i * 11) % 130);
                const y = 410 + ((i * 19) % 120);
                const r = 12 + ((i * 5) % 10);
                arboles.push({ x, y, r, fill: verdes[i % verdes.length], idx: i });
              }
              arboles.sort((a, b) => a.y - b.y);
              return arboles.map(t => `
                <g class="cierre-arbol">

function renderBossFight() {
  const hpPct = Math.max(0, game.bossHp);
  const lowCls = game.bossHp <= 20 ? ' super-low' : (game.bossHp <= 60 ? ' low' : '');
  const mostrarLlamado = game.bossHp <= 60 && !game.oleadaActivada;
  const mostrarAceitunas = game.bossHp <= 20;
  const teamSprites = game.oleadaActivada ?
    [...VECINES, 'sp-mesa', 'sp-instit', 'sp-comu', 'sp-terr', ...VECINES.slice(0,3)] :

function animateCrecimiento() {
  const stage = document.getElementById('asoc-stage');
  const counter = document.getElementById('contador');
  const next = document.getElementById('crece-next');
  const targets = [10, 50, 200, 500, 900];
  let cur = 2, idx = 0;

  function step() {
    if (idx >= targets.length) { next.hidden = false; return; }
    const target = targets[idx];
    const diff = target - cur;
    const sprites = Math.min(diff, 6);
    for (let i = 0; i < sprites; i++) {
      const s = VECINES[Math.floor(Math.random() * VECINES.length)];
      const div = document.createElement('div');
      div.className = 'actor';
      div.innerHTML = `<svg width="40" height="40"><use href="#${s}"/></svg>`;
      stage.appendChild(div);
    }
    cur = target;
    counter.textContent = cur;
    counter.classList.remove('pop'); void counter.offsetWidth; counter.classList.add('pop');
    playSfx('pop');
    idx++;
    setTimeout(step, 700);
  }
  setTimeout(step, 500);
}

function flickerScreen() {
  document.body.classList.add('flicker');
  setTimeout(() => document.body.classList.remove('flicker'), 800);
}

/* boss fight */
let _relatorActual = '';
let _relatorLockedUntil = 0;

function relatorDecir(texto, opts = {}) {
  // si está locked y no es prioritario, ignorar
  const ahora = Date.now();
  if (!opts.force && ahora < _relatorLockedUntil) return;

  _relatorActual = texto;
  // dura 3s mínimo antes de poder ser sobreescrito por mensajes no prioritarios
  _relatorLockedUntil = ahora + (opts.lockMs ?? 3000);

  const bubble = document.getElementById('relator-bubble');
  const txt = document.getElementById('relator-text');
  if (!bubble || !txt) return;
  txt.textContent = texto;
  bubble.classList.remove('relator-pop');
  void bubble.offsetWidth;
  bubble.classList.add('relator-pop');
}

function tirarPapel(papelId) {
  const papel = PAPELES.find(p => p.id === papelId);
  if (!papel) return;
  const stage = document.getElementById('boss-stage');
  const boss = document.getElementById('boss-actor');
  if (!stage || !boss) return;

  // relator narra el golpe · acción del usuario, sobreescribe siempre lo que estuviera diciendo
  if (papel.relato) relatorDecir(papel.relato, { force: true, lockMs: 3500 });

  // alternar lado de tirado: papel impar → izquierda, papel par → derecha
  const lado = (game.papelesUsados % 2 === 0) ? 'izq' : 'der';

  // proyectil que sale desde la esquina inferior del lado correspondiente
  const fly = document.createElement('div');
  fly.className = 'paper-fly';
  fly.textContent = papel.short;
  fly.style.bottom = '14%';
  if (lado === 'izq') fly.style.left = '8%';
  else fly.style.right = '8%';
  // calcular trayectoria hacia el centro arriba (donde está el boss)
  const stageRect = stage.getBoundingClientRect();
  const bossRect = boss.getBoundingClientRect();
  const bossCenterX = bossRect.left + bossRect.width/2 - stageRect.left;
  const startX = lado === 'izq'
    ? stageRect.width * 0.08 + 24
    : stageRect.width * 0.92 - 24;
  const dx = bossCenterX - startX;
  const dy = (bossRect.top + bossRect.height/2 - stageRect.top) - (stageRect.height * 0.86);
  fly.style.setProperty('--dx', dx + 'px');
  fly.style.setProperty('--dy', dy + 'px');
  stage.appendChild(fly);
  setTimeout(() => fly.remove(), 700);

  // boss reacciona al impacto: shake con rotación + saltito (siempre el mismo movimiento)
  setTimeout(() => {
    boss.classList.remove('boss-hit-izq', 'boss-hit-der');
    void boss.offsetWidth;
    boss.classList.add('boss-hit-izq');
    setTimeout(() => boss.classList.remove('boss-hit-izq'), 450);
  }, 600);

  // popup educativo
  setTimeout(() => {
    const pop = document.createElement('div');
    pop.className = 'edu-popup';
    pop.textContent = papel.edu;
    boss.appendChild(pop);
    setTimeout(() => pop.remove(), 1500);
  }, 400);

  setTimeout(() => {
    boss.classList.remove('shake'); void boss.offsetWidth; boss.classList.add('shake');
    playSfx('hit');

    const damageBase = 6;
    const multiplier = game.oleadaActivada ? 3 : 1;
    game.bossHp = Math.max(0, game.bossHp - damageBase * multiplier);
    game.papelesUsados++;
    saveGame();

    // si llega a 20% y aún no estaba aceitunas: re-render para que aparezcan
    // si llega a 0: ir a redención
    if (game.bossHp === 0) {
      setTimeout(() => render(), 500);
    } else if (game.bossHp <= 20 || game.bossHp <= 60) {
      const hpAhora = game.bossHp;
      setTimeout(() => {
        render();
        if (hpAhora <= 20) {
          setTimeout(() => relatorDecir(RELATOS_KO[Math.floor(Math.random()*RELATOS_KO.length)]), 80);
        }
      }, 500);
    } else {
      // actualizar HP visualmente sin re-render completo
      const fill = document.querySelector('.boss-hp-fill');
      if (fill) fill.style.width = game.bossHp + '%';
      const lbl = document.querySelector('.boss-hp-label');
      if (lbl) lbl.textContent = `⚔ JEFE BUROCRÁTICX · HP ${game.bossHp}/100`;
      // subir la barra de carga del super item
      const superFill = document.querySelector('.paper-super-charge-fill');
      if (superFill) {
        const pct = Math.min(100, Math.max(0, (100 - game.bossHp) / 80 * 100));
        superFill.style.height = pct + '%';
      }
    }
  }, 700);
}

function activarOleada() {
  game.oleadaActivada = true;
  saveGame();
  playSfx('crowd');
  render();
  // el relator celebra la oleada · acción del usuario, fuerza
  setTimeout(() => relatorDecir(
    RELATOS_OLEADA[Math.floor(Math.random()*RELATOS_OLEADA.length)],
    { force: true, lockMs: 3500 }
  ), 60);
}

function tirarMate() {
  const stage = document.getElementById('boss-stage');
  const boss = document.getElementById('boss-actor');
  if (!stage || !boss) return;

  // el relator se vuelve loco con el arma secreta · prioridad sobre cualquier lock
  relatorDecir(RELATOS_MATE[Math.floor(Math.random()*RELATOS_MATE.length)], { force: true, lockMs: 4500 });

  // boss empieza a temblequear apenas le llega el mate (un poco después del fly)
  setTimeout(() => boss.classList.add('boss-tembleque'), 700);

  // animación: el mate sube desde abajo hacia el boss (vista cenital)
  const fly = document.createElement('div');
  fly.style.position = 'absolute';
  fly.style.fontSize = '2.4rem';
  fly.style.left = '50%';
  fly.style.bottom = '8%';
  fly.style.transform = 'translateX(-50%)';
  fly.style.zIndex = '10';
  fly.style.transition = 'all 0.8s cubic-bezier(0.5, -0.3, 0.5, 1)';
  fly.style.pointerEvents = 'none';
  fly.textContent = '🧉';
  stage.appendChild(fly);
  requestAnimationFrame(() => {
    fly.style.bottom = '70%';
    fly.style.transform = 'translateX(-50%) rotate(540deg) scale(0.8)';
    fly.style.opacity = '0.55';
  });
  setTimeout(() => fly.remove(), 900);

  playSfx('victory');
  setTimeout(() => {
    game.bossHp = 0;
    game.bossRedimido = true;
    saveGame();
    setScene('boss-redimido');
  }, 4200);
}

/* ═══════════════════════════════════════════════════════════════════════
   TYPEWRITER
   ═══════════════════════════════════════════════════════════════════════ */

function escAttr(s) { return s.replace(/"/g, '&quot;'); }

function splitTextIntoPages(el, text) {
  // si el contenedor no tiene altura limitada, devolver el texto entero (no paginar)
  const cs = getComputedStyle(el);
  const overflow = cs.overflow || cs.overflowY;
  const hasMaxHeight = cs.maxHeight && cs.maxHeight !== 'none';
  const heightLimited = (overflow === 'hidden' || overflow === 'auto' || overflow === 'scroll') && hasMaxHeight;
  if (!heightLimited || el.clientHeight < 60) return [text];

  const measure = document.createElement('div');
  measure.style.cssText = `
    position: absolute; left: -9999px; top: 0;
    visibility: hidden; pointer-events: none;
    width: ${el.clientWidth}px;
    box-sizing: ${cs.boxSizing};
    padding: 0;
    font-family: ${cs.fontFamily};
    font-size: ${cs.fontSize};
    font-weight: ${cs.fontWeight};
    line-height: ${cs.lineHeight};
    letter-spacing: ${cs.letterSpacing};
    word-spacing: ${cs.wordSpacing};
    white-space: pre-wrap;
    word-break: break-word;
  `;
  document.body.appendChild(measure);
  const maxH = el.clientHeight;
  // tokenizar por palabras manteniendo whitespace
  const tokens = text.split(/(\s+)/);
  const pages = [];
  let cur = '';
  for (let i = 0; i < tokens.length; i++) {
    const next = cur + tokens[i];
    measure.textContent = next;
    if (measure.scrollHeight > maxH && cur.length > 0) {
      pages.push(cur.replace(/\s+$/, ''));
      cur = tokens[i].replace(/^\s+/, '');
    } else {
      cur = next;
    }
  }
  if (cur.trim().length > 0) pages.push(cur.replace(/\s+$/, ''));
  document.body.removeChild(measure);
  return pages.length > 0 ? pages : [''];
}

function runTypewriter(el) {
  if (el.dataset.played) return;
  el.dataset.played = '1';
  const fullText = el.dataset.text || '';
  // separadores manuales `---` para forzar nueva página; cada chunk se auto-pagina si no entra
  const explicit = fullText.split(/\n?---\n?/).map(p => p.trim()).filter(p => p.length > 0);
  let pages = [];
  for (const chunk of explicit) {
    const sub = splitTextIntoPages(el, chunk);
    for (const p of sub) pages.push(p);
  }
  if (pages.length === 0) pages = [''];
  let pageIdx = 0;
  let interval = null;
  let isWriting = false;
  let curText = '';

  const playPage = () => {
    curText = pages[pageIdx] || '';
    el.textContent = '';
    let i = 0;
    isWriting = true;
    // notificar el inicio de cada página (el texto va en detail.text)
    el.dispatchEvent(new CustomEvent('tw-page-start', {
      bubbles: true,
      detail: { pageIdx, text: curText },
    }));
    const cursor = document.createElement('span');
    cursor.className = 'tw-cursor';
    cursor.style.cssText = 'display:inline-block; width:0.5em; background:var(--neon-amber); margin-left:2px; animation: blink 0.8s steps(2) infinite;';
    cursor.textContent = '_';
    el.appendChild(cursor);
    interval = setInterval(() => {
      if (i >= curText.length) { clearInterval(interval); interval = null; cursor.remove(); isWriting = false; onPageDone(); return; }
      cursor.before(document.createTextNode(curText[i]));
      i++;
    }, 22);
  };

  const onPageDone = () => {
    pageIdx++;
    if (pageIdx < pages.length) {
      const next = document.createElement('span');
      next.className = 'tw-next-page';
      next.textContent = '  ▼';
      el.appendChild(next);
    } else {
      el.dispatchEvent(new CustomEvent('tw-done', { bubbles: true }));
    }
  };

  el.addEventListener('click', () => {
    if (isWriting) {
      if (interval) { clearInterval(interval); interval = null; }
      const cur = el.querySelector('.tw-cursor');
      if (cur) cur.remove();
      el.textContent = curText;
      isWriting = false;
      onPageDone();
    } else if (pageIdx < pages.length) {
      playPage();
    }
  });

  playPage();
}

/* ═══════════════════════════════════════════════════════════════════════
   HANDLERS
   ═══════════════════════════════════════════════════════════════════════ */

function attachHandlers() {
  const stage = document.getElementById('stage');

  stage.querySelectorAll('[data-next]').forEach(el => {
    el.addEventListener('click', () => {
      const next = el.dataset.next;
      if (!next) return;
      const sc = SCENES[game.scene];
      const nextSc = SCENES[next];
      // saltan todes en cascada al salir de una escena con actores hacia una sin esos actores
      const cambioDeEscenario =
        sc && (sc.actors === 'pandemia' || sc.actors === 'plaza') &&
        nextSc && nextSc.actors !== sc.actors;
      const celebra =
        cambioDeEscenario ||
        (sc && sc.celebra);
      if (celebra) {
        playSfx('victory');
        const actors = stage.querySelectorAll('.escena-pandemia .actor, .escena-plaza .actor');
        actors.forEach((a, i) => {
          a.classList.remove('idle', 'idle-fast', 'idle-slow', 'talker');
          a.style.animationDelay = (i * 80) + 'ms';
          a.classList.add('jump-celebrate');
        });
        const bubble = stage.querySelector('.speech-bubble');
        if (bubble) bubble.remove();
        // burst de éxito (flash breve + sparkles)
        document.body.classList.add('anime-success-burst');
        setTimeout(() => document.body.classList.remove('anime-success-burst'), 750);
        setTimeout(() => setScene(next), 900);
      } else {
        setScene(next); playSfx('click');
      }
    });
  });

  // municipio: abrir el expediente (transición carpeta cerrada → slider)
  stage.querySelectorAll('[data-muni-abrir]').forEach(el => {
    el.addEventListener('click', () => {
      game.despensaMuniAbierto = true;
      saveGame();
      playSfx('pop');
      render();
    });
  });
  // municipio: aprobar documento (slider)
  stage.querySelectorAll('[data-muni-firma]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.muniFirma;
      if (!Array.isArray(game.despensaMuniFirmas)) game.despensaMuniFirmas = [];
      if (game.despensaMuniFirmas.includes(id)) return;
      game.despensaMuniFirmas.push(id);
      // sello dramático: animación pum + auto-avanza al siguiente no firmado
      const card = stage.querySelector('.muni-doc-card');
      if (card) {
        card.classList.add('firmado');
        const sello = document.createElement('div');
        sello.className = 'muni-doc-sello-grande visible';
        sello.textContent = '★ APROBADO';
        card.appendChild(sello);
      }
      playSfx('correct');
      saveGame();
      setTimeout(() => {
        // avanzar al siguiente no firmado
        const total = MUNI_DOCS.length;
        let next = (game.despensaMuniIdx || 0);
        for (let k = 1; k <= total; k++) {
          const j = (next + k) % total;
          if (!game.despensaMuniFirmas.includes(MUNI_DOCS[j].id)) { next = j; break; }
        }
        game.despensaMuniIdx = next;
        saveGame();
        render();
      }, 1000);
    });
  });
  // municipio: navegación slider (prev/next)
  stage.querySelectorAll('[data-muni-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const dir = parseInt(el.dataset.muniNav, 10);
      const cur = game.despensaMuniIdx || 0;
      const next = Math.max(0, Math.min(MUNI_DOCS.length - 1, cur + dir));
      if (next === cur) return;
      game.despensaMuniIdx = next;
      saveGame();
      playSfx('click');
      render();
    });
  });
  // municipio: navegación slider (pips)
  stage.querySelectorAll('[data-muni-pip]').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.muniPip, 10);
      if (i === (game.despensaMuniIdx || 0)) return;
      game.despensaMuniIdx = i;
      saveGame();
      playSfx('click');
      render();
    });
  });

  // provincia: avanzar etapa de construcción (deck → techo → cerramiento → devolución)
  stage.querySelectorAll('[data-prov-avanzar]').forEach(el => {
    el.addEventListener('click', () => {
      const cur = game.despensaProvinciaPaso || 0;
      const next = cur + 1;
      if (next >= PROV_ETAPAS.length) return;
      // sparkle al clickear el botón aplicar
      const chip = el.closest('.prov-recurso-chip') || el;
      const rect = chip.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      for (let i = 0; i < 12; i++) {
        const s = document.createElement('span');
        s.className = 'prov-sparkle';
        const angle = (i / 12) * Math.PI * 2 + (Math.random() * 0.4);
        const dist = 50 + Math.random() * 40;
        s.style.setProperty('--sx', cx + 'px');
        s.style.setProperty('--sy', cy + 'px');
        s.style.setProperty('--sdx', (Math.cos(angle) * dist) + 'px');
        s.style.setProperty('--sdy', (Math.sin(angle) * dist) + 'px');
        s.style.animationDelay = (Math.random() * 0.08) + 's';
        chip.appendChild(s);
        setTimeout(() => s.remove(), 900);
      }
      game.despensaProvinciaPaso = next;
      saveGame();
      playSfx(cur === 0 ? 'build' : (next === PROV_ETAPAS.length - 1 ? 'correct' : 'build'));
      // delay un toque para dejar ver el sparkle
      setTimeout(() => render(), 240);
    });
  });

  // cierre del capítulo: al tocar Continuar, alborotar la multitud antes de cambiar de escena
  stage.querySelectorAll('[data-cierre-continuar]').forEach(el => {
    el.addEventListener('click', () => {
      const next = el.dataset.cierreContinuar;
      const stageEl = document.querySelector('.cierre-stage');
      if (stageEl) stageEl.classList.add('cierre-festejando');
      el.disabled = true;
      playSfx('victory');
      setTimeout(() => setScene(next), 1500);
    });
  });

  // reinversión: empezar (saca el dialog intro)
  stage.querySelectorAll('[data-reinv-start]').forEach(el => {
    el.addEventListener('click', () => {
      game.reinvStarted = true;
      saveGame();
      playSfx('click');
      render();
    });
  });

  // reinversión: sumar asociadxs
  stage.querySelectorAll('[data-reinv-action="sumar"]').forEach(el => {
    el.addEventListener('click', () => {
      game.reinvAsociados = (game.reinvAsociados || 0) + REINV_ASOC_PASO;
      game.reinvExcedente = (game.reinvExcedente || 0) + REINV_APORTE_POR_GRUPO;
      saveGame();
      playSfx('crowd');
      render();
    });
  });
  // reinversión: comprar item
  stage.querySelectorAll('[data-reinv-buy]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.reinvBuy;
      const it = REINV_ITEMS.find(x => x.id === id);
      if (!it) return;
      if (!game.reinvCompras) game.reinvCompras = {};
      if (game.reinvCompras[id]) return;
      if ((game.reinvExcedente || 0) < it.precio) {
        playSfx('wrong');
        const dlg = document.getElementById('reinv-dialog');
        if (dlg) {
          const txt = dlg.querySelector('.dialog');
          if (txt) txt.textContent = 'No alcanza el excedente para esto. Sumá más asociadxs primero.';
        }
        return;
      }
      game.reinvExcedente -= it.precio;
      game.reinvCompras[id] = true;
      saveGame();
      playSfx('correct');
      render();
    });
  });
  // reinversión: trampa "repartir ganancias"
  stage.querySelectorAll('[data-reinv-trap]').forEach(el => {
    el.addEventListener('click', () => {
      el.classList.add('trap-shake');
      setTimeout(() => el.classList.remove('trap-shake'), 600);
      playSfx('wrong');
      const dlg = document.getElementById('reinv-dialog');
      if (!dlg) return;
      dlg.style.borderColor = 'var(--neon-red)';
      const name = dlg.querySelector('.dialog-name');
      const txt = dlg.querySelector('.dialog');
      if (name) {
        name.style.background = 'var(--neon-red)';
        name.style.color = 'var(--cream)';
        name.textContent = '✗ ESO NO';
      }
      if (txt) txt.textContent = 'Una mutual NO reparte ganancias entre socios. No hay socios inversores. Los excedentes SIEMPRE se reinvierten en el proyecto.';
      setTimeout(() => {
        if (dlg) dlg.style.borderColor = '';
        if (name) {
          name.style.background = '';
          name.style.color = '';
          name.textContent = '★ NARRADOR';
        }
        if (txt) txt.textContent = 'Sumá asociadxs para acumular más excedente. Después invertí en lo que necesitamos.';
      }, 4000);
    });
  });

  // mini-juego excedente: empezar (saca el dialog intro)
  stage.querySelectorAll('[data-excedente-start]').forEach(el => {
    el.addEventListener('click', () => {
      game.excedenteStarted = true;
      saveGame();
      playSfx('click');
      render();
    });
  });

  // mini-juego excedente: ajustar precio
  stage.querySelectorAll('[data-excedente-step]').forEach(el => {
    el.addEventListener('click', () => {
      const step = parseInt(el.dataset.excedenteStep) * PRECIO_PASO;
      let p = (game.precioFinal || 8500) + step;
      p = Math.max(PRECIO_MIN, Math.min(PRECIO_MAX, p));
      game.precioFinal = p;
      game.precioTocado = true;
      saveGame();
      playSfx('click');
      render();
    });
  });

  // intro: empezar elección
  stage.querySelectorAll('[data-eleccion-start]').forEach(el => {
    el.addEventListener('click', () => {
      game.comprasEleccionStarted = true;
      saveGame();
      playSfx('click');
      render();
    });
  });

  // elección de productos: SÍ / NO sumar (o versus a / b)
  stage.querySelectorAll('[data-eleccion]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = game.comprasEleccionIdx || 0;
      const p = PRODUCTOS[idx];
      if (!p) return;
      const choice = el.dataset.eleccion;
      let acertaste;
      if (p.versus) {
        acertaste = (choice === p.correcta);
      } else {
        acertaste = (choice === 'si' && p.bueno) || (choice === 'no' && !p.bueno);
      }
      const dlg = document.getElementById('eleccion-dialog');
      if (!dlg) return;
      // header dinámico según qué pasó: acierto, o tipo de error
      let speakerLabel, speakerColor;
      if (acertaste) {
        speakerLabel = '★ ¡EXACTO!';
        speakerColor = 'var(--neon-green)';
      } else if (p.versus) {
        speakerLabel = '★ MEJOR LA OTRA';
        speakerColor = 'var(--neon-red)';
      } else if (p.bueno && choice === 'no') {
        speakerLabel = '★ RECONSIDEREMOS';
        speakerColor = 'var(--neon-amber)';
      } else {
        speakerLabel = '★ MEJOR NO';
        speakerColor = 'var(--neon-red)';
      }
      // siempre se muestra la explicación pedagógica del producto, sea acierto o error
      const fbText = p.feedback || '';
      dlg.style.borderColor = speakerColor;
      dlg.innerHTML = `
        <div class="dialog-name" style="background:${speakerColor}; color:var(--ink);">${speakerLabel}</div>
        <div class="dialog tw" data-text="${escAttr(fbText)}"></div>
        <div class="dialog-actions" id="eleccion-cta"></div>
      `;
      const tw = dlg.querySelector('.dialog.tw');
      if (tw) runTypewriter(tw);
      playSfx(acertaste ? 'correct' : 'wrong');
      if (acertaste) {
        game.comprasEleccionAciertos = (game.comprasEleccionAciertos || 0) + 1;
      }
      // reacción de la audiencia: alboroto si acertaste, agachada si no
      const aud = document.getElementById('audiencia');
      if (aud) {
        const cls = acertaste ? 'alborotado' : 'agachado';
        const vecines = aud.querySelectorAll('.veci-back');
        vecines.forEach((v, i) => {
          v.style.animationDelay = (i * 60) + 'ms';
          v.classList.add(cls);
          setTimeout(() => v.classList.remove(cls), 900);
        });
        // si erraste: un vecine "habla" — se da vuelta, rebota y suelta un globito
        if (!acertaste && vecines.length) {
          const speakerIdx = Math.floor(Math.random() * vecines.length);
          const sp = vecines[speakerIdx];
          // sprite frontal (se da vuelta)
          const useEl = sp.querySelector('use');
          const oldHref = useEl?.getAttribute('href') || '';
          if (useEl) useEl.setAttribute('href', '#sp-v' + ((speakerIdx % 4) + 1));
          // burbuja
          const bubble = document.createElement('div');
          bubble.className = 'speech-bubble protesta-bubble';
          bubble.innerHTML = '<span class="dot">·</span><span class="dot">·</span><span class="dot">·</span>';
          sp.appendChild(bubble);
          sp.classList.add('talker-back');
          setTimeout(() => {
            sp.classList.remove('talker-back');
            bubble.remove();
            if (useEl) useEl.setAttribute('href', oldHref);
          }, 2400);
        }
      }
      const showCTA = () => {
        const cta = dlg.querySelector('#eleccion-cta');
        if (!cta) return;
        cta.innerHTML = `<button class="btn-arcade primary" data-eleccion-next="1">▶ Siguiente</button>`;
        const btn = cta.querySelector('button');
        btn.addEventListener('click', () => {
          game.comprasEleccionIdx = (game.comprasEleccionIdx || 0) + 1;
          saveGame();
          render();
          playSfx('click');
        });
      };
      if (tw) tw.addEventListener('tw-done', showCTA, { once: true });
      else showCTA();
      saveGame();
    });
  });

  // boca en boca: click en un vecine activa y trae a más
  stage.querySelectorAll('.boca-vec').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('activated')) return;
      const idx = parseInt(el.dataset.bocaIdx);
      const r = game.bocaTaps || 0;
      const visibles = BOCA_RONDAS[r].hasta;
      if (idx >= visibles) return;
      if (!Array.isArray(game.bocaActivados)) game.bocaActivados = [];
      if (game.bocaActivados.includes(idx)) return;
      game.bocaActivados.push(idx);
      el.classList.add('activated', 'gritando');
      playSfx('crowd');
      game.bocaTaps = Math.min(BOCA_RONDAS.length - 1, r + 1);
      saveGame();
      setTimeout(() => render(), 850);
    });
  });

  // press start
  const ps = document.getElementById('press-start');
  if (ps) ps.addEventListener('click', () => {
    playSfx('start');
    statsRunStart();
    setTimeout(() => setScene('chapter1-intro'), 240);
  });


  // construir despensa
  const ctrBtn = document.getElementById('construir-btn');
  if (ctrBtn) {
    ctrBtn.addEventListener('click', () => {
      game.despensa = Math.min(3, game.despensa + 1);
      saveGame();
      playSfx('build');
      render();
    });
  }

  // choice (mini-decisión pedagógica)
  stage.querySelectorAll('[data-choice-idx]').forEach(el => {
    el.addEventListener('click', () => {
      const sc = SCENES[game.scene];
      const idx = parseInt(el.dataset.choiceIdx);
      const op = sc.opciones[idx];
      const dlgBox = stage.querySelector('.dialog-box.anchor');
      if (!dlgBox) return;

      const feedbackText = op.feedback || (op.bueno ? '¡Eso!' : '');
      dlgBox.classList.add('feedback-mode');
      if (op.bueno) {
        dlgBox.style.borderColor = 'var(--neon-green)';
        dlgBox.style.background = 'rgba(15, 13, 35, 0.95)';
        dlgBox.innerHTML = `
          <div class="dialog-name" style="background: var(--neon-green); color: var(--ink);">✓ EXACTO</div>
          <div class="dialog tw" data-text="${escAttr(feedbackText)}" style="white-space: pre-line;"></div>
          <div class="dialog-actions" id="choice-feedback-actions"></div>
        `;
        playSfx('correct');
      } else {
        dlgBox.style.borderColor = 'var(--neon-red)';
        dlgBox.innerHTML = `
          <div class="dialog-name" style="background: var(--neon-red); color: var(--cream);">✗ NO TANTO</div>
          <div class="dialog tw" data-text="${escAttr(feedbackText)}" style="white-space: pre-line;"></div>
          <div class="dialog-actions" id="choice-feedback-actions"></div>
        `;
        playSfx('wrong');
      }
      // typewriter del feedback
      const fbDialog = dlgBox.querySelector('.dialog.tw');
      if (fbDialog) runTypewriter(fbDialog);
      // botón aparece al terminar el typewriter
      const showButton = () => {
        const actions = dlgBox.querySelector('#choice-feedback-actions');
        if (!actions) return;
        if (op.bueno) {
          actions.innerHTML = `<button class="btn-arcade primary" data-next="${op.next}">▶ Continuar</button>`;
        } else {
          actions.innerHTML = `<button class="btn-arcade" data-action="reintentar">↺ Probá de nuevo</button>`;
        }
        attachHandlers();
        stage.querySelectorAll('[data-action="reintentar"]').forEach(b => b.addEventListener('click', () => render()));
      };
      if (fbDialog) {
        fbDialog.addEventListener('tw-done', showButton, { once: true });
      } else {
        showButton();
      }
    });
  });

  // boss fight: papeles
  stage.querySelectorAll('[data-paper]').forEach(el => {
    el.addEventListener('click', () => tirarPapel(el.dataset.paper));
  });

  // call to associates
  document.getElementById('call-btn')?.addEventListener('click', activarOleada);

  // matecito
  document.getElementById('mate-btn')?.addEventListener('click', tirarMate);

  // final decision
  stage.querySelectorAll('[data-final]').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.dataset.final;
      const dlgBox = stage.querySelector('.dialog-box.anchor');
      if (v === 'no' && dlgBox) {
        dlgBox.style.borderColor = 'var(--neon-amber)';
        dlgBox.innerHTML = `
          <div class="dialog-name" style="background: var(--neon-amber); color: var(--ink);">⚠ ESPERÁ</div>
          <div class="dialog">Una mutual no se cierra a quien quiere sumarse de buena fe. La mutual incluye, no excluye.</div>
          <div class="dialog-actions">
            <button class="btn-arcade primary" data-final="si">✓ Bueno, dale</button>
          </div>
        `;
        attachHandlers();
      } else {
        game.finalAceptado = true;
        saveGame();
        statsRunFinish();
        playSfx('victory');
        // Si estamos en boss-redimido, animación sutil de festejo antes de victory:
        // 1) ex-villano festeja en su lugar (~0.9s)
        // 2) se acerca caminando suave al grupo (~0.9s)
        // 3) saltan todos juntos un par de veces (~1.4s)
        const bossPer = document.getElementById('encuentro-boss');
        const asocPer = document.getElementById('encuentro-asoc');
        if (bossPer && asocPer && game.scene === 'boss-redimido') {
          if (dlgBox) dlgBox.classList.add('actions-hidden');
          bossPer.classList.add('villano-festeja-solo');
          setTimeout(() => {
            bossPer.classList.remove('villano-festeja-solo');
            bossPer.classList.add('villano-acercarse');
          }, 900);
          setTimeout(() => {
            bossPer.classList.remove('villano-acercarse');
            bossPer.classList.add('villano-llegado');
            bossPer.classList.add('todos-saltan-juntos');
            asocPer.classList.add('todos-saltan-juntos');
          }, 1800);
          setTimeout(() => setScene('victory'), 3300);
        } else {
          setScene('victory');
        }
      }
    });
  });

  // share
  document.getElementById('share-btn')?.addEventListener('click', share);

  // restart
  stage.querySelectorAll('[data-restart]').forEach(el => {
    el.addEventListener('click', () => {
      resetGameState();
      saveGame();
      setScene('title');
    });
  });
}

async function share() {
  const url = window.location.href;
  const title = 'La Correntosa · Una historia mutualista';
  const text = 'Conocé a la primera mutual de Villa La Angostura jugando esta historia interactiva.';
  if (navigator.share) {
    try { await navigator.share({ title, text, url }); } catch(e) {}
  } else {
    try {
      await navigator.clipboard.writeText(url);
      alert('Link copiado al portapapeles.');
    } catch (e) { alert(url); }
  }
}

const DEV_SCENE_ORDER = [
  'title',

  'compras-eleccion',

];
document.addEventListener('keydown', (e) => {
  if (e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    if (e.target.matches('input, textarea')) return;
    e.preventDefault();
    e.stopPropagation();
    const cur = DEV_SCENE_ORDER.indexOf(game.scene);
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    const idx = cur < 0 ? 0 : cur + dir;
    if (idx >= 0 && idx < DEV_SCENE_ORDER.length) {
      const target = DEV_SCENE_ORDER[idx];
      // marcar fases como ya completadas para que no haya un "muro" al saltar
      if (game.compras) {
        Object.keys(game.compras).forEach(k => game.compras[k] = true);
      }
      game.bocaTaps = (typeof BOCA_RONDAS !== 'undefined') ? BOCA_RONDAS.length - 1 : 6;
      game.bocaActivados = (typeof BOCA_POS !== 'undefined') ? BOCA_POS.map((_, i) => i) : [];
      game.comprasEleccionStarted = true;
      game.comprasEleccionIdx = (typeof PRODUCTOS !== 'undefined') ? PRODUCTOS.length : 10;
      game.despensa = 3;
      setScene(target);
    }
  }
}, true);

document.addEventListener('keydown', (e) => {
  // ignorar si está escribiendo en un input
  if (e.target.matches('input, textarea')) return;
  // SHIFT + flechas son atajos de dev, no avanzar UI
  if (e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;

  // ArrowRight: SOLO skipear/avanzar el texto del typewriter (no avanza de escena)
  if (e.key === 'ArrowRight') {
    const tw = document.querySelector('.dialog.tw');
    if (tw && tw.offsetParent !== null) {
      e.preventDefault();
      tw.click();
    }
    return;
  }

  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    // 1) press-start si está activo
    const ps = document.getElementById('press-start');
    if (ps && ps.offsetParent !== null) { ps.click(); return; }

  if (kind === 'hit') { tone(180, 0.06, 'sawtooth', 0.06); }
  if (kind === 'crowd') { [220, 330, 440, 550].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'square', 0.05), i * 60)); }
  if (kind === 'victory') [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.15), i * 100));
  if (kind === 'start') {
    // CLIN! arcade — tipo "moneda Mario" + sostén dorado
    tone(988, 0.06, 'square', 0.06);
    setTimeout(() => tone(1319, 0.18, 'square', 0.07), 70);
    setTimeout(() => tone(1568, 0.22, 'triangle', 0.05), 150);
    setTimeout(() => tone(2093, 0.32, 'triangle', 0.04), 240);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════════ */

(function init() {
  // cada recarga arranca de cero: ignoramos el saveGame y reseteamos al título.
  // Las stats locales (veces completado, mejor tiempo) sí se conservan entre sesiones.
  loadStats();
  resetGameState();
  game.scene = 'title';
  saveGame();
  render();
})();

} // fin del else de _MOBILE_FRAME_MODE
</script>
