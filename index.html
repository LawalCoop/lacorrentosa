<style>
  /* layout específico del juego */
  .stage {
    position: relative;
    z-index: 5;
    max-width: 760px;
    margin: 0 auto;
    padding: 1rem;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  @media (min-width: 1024px) { .stage { max-width: 1100px; padding: 1.5rem; } }

  .scene { display: none; animation: fade-in 0.4s ease-out; }
  .scene.active { display: block; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* layout de personajes en escena 1: dos vecines en mesa */
  .escena-pandemia {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 1rem;
    margin: 1.5rem 0 0.5rem;
    min-height: 140px;
  }
  .mesa-pixel {
    width: 80px; height: 16px;
    background: linear-gradient(180deg, var(--cream-2) 0%, #8a6c3a 100%);
    border: 2px solid var(--ink);
    margin: 0 -8px;
    align-self: flex-end;
    position: relative;
  }

  /* sumar asociados — grilla animada */
  .asociadxs-stage {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.3rem;
    margin: 1rem 0;
    min-height: 100px;
  }
  .asociadxs-stage .actor {
    animation: drop-in 0.3s ease-out;
  }
  @keyframes drop-in {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* productores aparecen en grupo */
  .productores-stage {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    margin: 1rem 0;
  }
  .productores-stage .actor svg { width: 56px; height: 56px; }

  /* contador grande con label */
  .counter-block {
    text-align: center;
    margin: 1rem 0;
  }
  .counter-label {
    font-family: var(--f-mono);
    font-size: 1rem;
    color: var(--cream-2);
    letter-spacing: 0.05em;
    margin-top: 0.4rem;
  }

  /* niño/a comiendo */
  .nino-comiendo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    margin: 1rem 0;
  }
  .nino-comiendo .heart-burst {
    font-size: 1.4rem;
    color: var(--neon-pink);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
</style>

</head>

function setScene(name) {
  game.scene = name;
  saveGame();
  render();
  window.scrollTo(0, 0);
}

function render() {
  const stage = document.getElementById('stage');
  const sc = SCENES[game.scene];
  if (!sc) { stage.innerHTML = '<div class="panel">Escena no encontrada.</div>'; return; }

  if (sc.type === 'title') stage.innerHTML = renderTitle();
  else if (sc.type === 'dialog') stage.innerHTML = renderDialog(sc);
  else if (sc.type === 'crecimiento') { stage.innerHTML = renderCrecimiento(); animateCrecimiento(); }
  else if (sc.type === 'choice') stage.innerHTML = renderChoice(sc);
  else if (sc.type === 'productores') { stage.innerHTML = renderProductores(); }
  else if (sc.type === 'construccion') { stage.innerHTML = renderConstruccion(); }
  else if (sc.type === 'sanos') { stage.innerHTML = renderSanos(); }
  else if (sc.type === 'boss-intro') { stage.innerHTML = renderBossIntro(); }
  else if (sc.type === 'boss-fight') { stage.innerHTML = renderBossFight(); }
  else if (sc.type === 'boss-redimido') { stage.innerHTML = renderBossRedimido(); }
  else if (sc.type === 'final-decision') { stage.innerHTML = renderFinalDecision(); }
  else if (sc.type === 'victory') { stage.innerHTML = renderVictory(); }

  attachHandlers();

  // typewriter en escenas con texto
  document.querySelectorAll('.tw').forEach(el => runTypewriter(el));

  // skip btn
  document.getElementById('skip-btn').hidden = (game.scene === 'title' || game.scene === 'victory');
  if (sc.flicker) flickerScreen();
}

        <div class="actor idle"><svg width="64" height="64"><use href="#sp-mesa"/></svg></div>
        <div class="actor idle idle-fast"><svg width="64" height="64"><use href="#sp-instit"/></svg></div>

    </div>
  `;

function animateCrecimiento() {
  const stage = document.getElementById('asoc-stage');
  const counter = document.getElementById('contador');
  const next = document.getElementById('crece-next');
  const targets = [10, 50, 200, 500, 900];
  let cur = 2, idx = 0;

  function step() {
    if (idx >= targets.length) { next.hidden = false; return; }
    const target = targets[idx];
    const diff = target - cur;
    const sprites = Math.min(diff, 6);
    for (let i = 0; i < sprites; i++) {
      const s = VECINES[Math.floor(Math.random() * VECINES.length)];
      const div = document.createElement('div');
      div.className = 'actor';
      div.innerHTML = `<svg width="40" height="40"><use href="#${s}"/></svg>`;
      stage.appendChild(div);
    }
    cur = target;
    counter.textContent = cur;
    counter.classList.remove('pop'); void counter.offsetWidth; counter.classList.add('pop');
    playSfx('pop');
    idx++;
    setTimeout(step, 700);
  }
  setTimeout(step, 500);
}

function flickerScreen() {
  document.body.classList.add('flicker');
  setTimeout(() => document.body.classList.remove('flicker'), 800);
}

/* boss fight */
function tirarPapel(papelId) {
  const papel = PAPELES.find(p => p.id === papelId);
  if (!papel) return;
  const stage = document.getElementById('boss-stage');
  const boss = document.getElementById('boss-actor');
  if (!stage || !boss) return;

  // proyectil
  const fly = document.createElement('div');
  fly.className = 'paper-fly';
  fly.textContent = papel.short;
  fly.style.left = '20%';
  fly.style.top = '50%';
  const dx = (boss.getBoundingClientRect().left - stage.getBoundingClientRect().left) - 40;
  fly.style.setProperty('--dx', dx + 'px');
  fly.style.setProperty('--dy', '-20px');
  stage.appendChild(fly);
  setTimeout(() => fly.remove(), 700);

  // popup educativo
  setTimeout(() => {
    const pop = document.createElement('div');
    pop.className = 'edu-popup';
    pop.textContent = papel.edu;
    boss.appendChild(pop);
    setTimeout(() => pop.remove(), 1500);
  }, 400);

  setTimeout(() => {
    boss.classList.remove('shake'); void boss.offsetWidth; boss.classList.add('shake');
    playSfx('hit');

    const damageBase = 6;
    const multiplier = game.oleadaActivada ? 3 : 1;
    game.bossHp = Math.max(0, game.bossHp - damageBase * multiplier);
    game.papelesUsados++;
    saveGame();

    // si llega a 20% y aún no estaba aceitunas: re-render para que aparezcan
    // si llega a 0: ir a redención
    if (game.bossHp === 0) {
      // forzar a abrir aceitunas si no se tiraron
      setTimeout(() => render(), 500);
    } else if (game.bossHp <= 20 || game.bossHp <= 60) {
      setTimeout(() => render(), 500);
    } else {
      // actualizar HP visualmente sin re-render completo
      const fill = document.querySelector('.hp-boss-fill');
      if (fill) fill.style.width = game.bossHp + '%';
      const lbl = document.querySelector('.hp-boss-label');
      if (lbl) lbl.textContent = `JEFE BUROCRÁTICX · HP ${game.bossHp}/100`;
    }
  }, 700);
}

function activarOleada() {
  game.oleadaActivada = true;
  saveGame();
  playSfx('crowd');
  render();
}

function tirarAceitunas() {
  const stage = document.getElementById('boss-stage');
  const boss = document.getElementById('boss-actor');
  if (!stage || !boss) return;

  // animación: aceitunas vuelan al boss
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const fly = document.createElement('div');
      fly.style.position = 'absolute';
      fly.style.fontSize = '2rem';
      fly.style.left = '50%';
      fly.style.bottom = '0';
      fly.style.zIndex = '10';
      fly.style.transition = 'all 0.6s ease-out';
      fly.style.pointerEvents = 'none';
      fly.textContent = '🫒';
      stage.appendChild(fly);
      requestAnimationFrame(() => {
        fly.style.transform = 'translate(120px, -120px) rotate(720deg)';
        fly.style.opacity = '0.3';
      });
      setTimeout(() => fly.remove(), 700);
    }, i * 200);
  }

  playSfx('victory');
  setTimeout(() => {
    game.bossHp = 0;
    game.bossRedimido = true;
    saveGame();
    setScene('boss-redimido');
  }, 1500);
}

function escAttr(s) { return s.replace(/"/g, '&quot;'); }

function runTypewriter(el) {
  if (el.dataset.played) return;
  el.dataset.played = '1';
  const text = el.dataset.text || '';
  el.textContent = '';
  let i = 0;
  const cursor = document.createElement('span');
  cursor.style.cssText = 'display:inline-block; width:0.5em; background:var(--neon-amber); margin-left:2px; animation: blink 0.8s steps(2) infinite;';
  cursor.textContent = '_';
  el.appendChild(cursor);
  const t = setInterval(() => {
    if (i >= text.length) { clearInterval(t); cursor.remove(); return; }
    cursor.before(document.createTextNode(text[i]));
    i++;
  }, 22);
  // skip on click
  el.addEventListener('click', () => {
    clearInterval(t);
    el.textContent = text;
  }, { once: true });
}

function attachHandlers() {
  const stage = document.getElementById('stage');

  stage.querySelectorAll('[data-next]').forEach(el => {
    el.addEventListener('click', () => {
      const next = el.dataset.next;
      if (next) { setScene(next); playSfx('click'); }
    });
  });

  // press start
  const ps = document.getElementById('press-start');
  if (ps) ps.addEventListener('click', () => { setScene('prologo'); playSfx('click'); });

  // construir despensa
  const ctrBtn = document.getElementById('construir-btn');
  if (ctrBtn) {
    ctrBtn.addEventListener('click', () => {
      game.despensa = Math.min(3, game.despensa + 1);
      saveGame();
      playSfx('build');
      render();
    });
  }

  // choice (mini-decisión pedagógica)
  stage.querySelectorAll('[data-choice-idx]').forEach(el => {
    el.addEventListener('click', () => {
      const sc = SCENES[game.scene];
      const idx = parseInt(el.dataset.choiceIdx);
      const op = sc.opciones[idx];
      const fb = document.getElementById('choice-feedback');
      if (op.bueno) {
        fb.innerHTML = `
          <div class="dialog-box no-arrow" style="background: rgba(88, 232, 126, 0.15); border-color: var(--neon-green);">
            <div class="dialog-name" style="background: var(--neon-green);">✓ EXACTO</div>
            <div class="dialog">${op.feedback || '¡Eso!'}</div>
          </div>
          <div class="btn-row">
            <button class="btn-arcade primary" data-next="${op.next}">▶ Continuar</button>
          </div>
        `;
        playSfx('correct');
      } else {
        fb.innerHTML = `
          <div class="dialog-box no-arrow" style="background: rgba(255, 71, 87, 0.15); border-color: var(--neon-red);">
            <div class="dialog-name" style="background: var(--neon-red); color: var(--cream);">✗ NO TANTO</div>
            <div class="dialog">${op.feedback}</div>
          </div>
          <div class="btn-row">
            <button class="btn-arcade" id="reintentar">↺ Probá de nuevo</button>
          </div>
        `;
        playSfx('wrong');
        setTimeout(() => {
          document.getElementById('reintentar')?.addEventListener('click', () => render());
        }, 100);
      }
      attachHandlers();
    });
  });

  // boss fight: papeles
  stage.querySelectorAll('[data-paper]').forEach(el => {
    el.addEventListener('click', () => tirarPapel(el.dataset.paper));
  });

  // call to associates
  document.getElementById('call-btn')?.addEventListener('click', activarOleada);

  // aceitunas
  document.getElementById('aceitunas-btn')?.addEventListener('click', tirarAceitunas);

  // final decision
  stage.querySelectorAll('[data-final]').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.dataset.final;
      const fb = document.getElementById('final-feedback');
      if (v === 'no') {
        fb.innerHTML = `
          <div class="dialog-box no-arrow" style="background: rgba(255, 177, 60, 0.15); border-color: var(--neon-amber);">
            <div class="dialog-name" style="background: var(--neon-amber); color: var(--ink);">⚠ ESPERÁ</div>
            <div class="dialog">Una mutual no se cierra a quien quiere sumarse de buena fe. La mutual incluye, no excluye.</div>
          </div>
          <div class="btn-row">
            <button class="btn-arcade" data-final="si">✓ Bueno, dale</button>
          </div>
        `;
        attachHandlers();
      } else {
        game.finalAceptado = true;
        saveGame();
        playSfx('victory');
        setScene('victory');
      }
    });
  });

  // share
  document.getElementById('share-btn')?.addEventListener('click', share);

  // restart
  stage.querySelectorAll('[data-restart]').forEach(el => {
    el.addEventListener('click', () => {
      // reset
      Object.assign(game, {
        scene: 'title', asociadxs: 0, productores: 0, despensa: 0,
        bossHp: 100, bossPhase: 1, papelesUsados: 0,
        oleadaActivada: false, bossRedimido: false, finalAceptado: null,
      });
      saveGame();
      setScene('title');
    });
  });
}

async function share() {
  const url = window.location.href;
  const title = 'La Correntosa · Una historia mutualista';
  const text = 'Conocé a la primera mutual de Villa La Angostura jugando esta historia interactiva.';
  if (navigator.share) {
    try { await navigator.share({ title, text, url }); } catch(e) {}
  } else {
    try {
      await navigator.clipboard.writeText(url);
      alert('Link copiado al portapapeles.');
    } catch (e) { alert(url); }
  }
}

  if (confirm('¿Saltar al final?')) setScene('victory');
});

/* atajos de teclado: Enter / Espacio / → avanzan al botón primario visible */
document.addEventListener('keydown', (e) => {
  // ignorar si está escribiendo en un input
  if (e.target.matches('input, textarea')) return;

  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
    e.preventDefault();
    // 1) press-start si está activo
    const ps = document.getElementById('press-start');
    if (ps && ps.offsetParent !== null) { ps.click(); return; }
    // 2) botón primario visible
    const primary = document.querySelector('.btn-arcade.primary, .btn-arcade.danger, .btn-arcade.warn');
    if (primary && primary.offsetParent !== null) { primary.click(); return; }
    // 3) cualquier btn-arcade visible (continuar)
    const any = document.querySelector('.btn-arcade');
    if (any && any.offsetParent !== null) { any.click(); return; }
    // 4) en boss fight: tirar primer papel disponible
    const paper = document.querySelector('.paper-btn:not(:disabled)');
    if (paper) { paper.click(); return; }
  }

  if (e.key === 'Escape') {
    e.preventDefault();
    document.getElementById('skip-btn')?.click();
  }
});

/* ═══════════════════════════════════════════════════════════════════════
   AUDIO · chiptune + sfx
   ═══════════════════════════════════════════════════════════════════════ */

let audioCtx = null, masterGain = null, musicaRunning = false, nextLoopTime = 0, schedId = null;
const BPM = 124, BEAT = 60/BPM, SIXTEENTH = BEAT/2, COMPAS = BEAT*4, LOOP_LEN = COMPAS*4;
const N = { A2:110,F2:87.31,C3:130.81,G2:98,A3:220,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880 };
const BASS = [N.A2, N.F2, N.C3, N.G2];
const MELODY = [
  [N.A4,N.A4,N.C5,N.E5,N.A5,N.E5,N.C5,N.A4],
  [N.F4,N.F4,N.A4,N.C5,N.F5,N.C5,N.A4,N.F4],
  [N.E4,N.E4,N.G4,N.C5,N.E5,N.C5,N.G4,N.E4],
  [N.G4,N.G4,N.B4,N.D5,N.G5,N.D5,N.B4,N.G4]
];
const HARM = [[N.E4,N.A4,N.E4,N.C5],[N.C4,N.F4,N.C4,N.A4],[N.G4,N.C5,N.G4,N.E4],[N.D4,N.G4,N.D4,N.B4]];

function musN(t,f,d,type,v){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.005);g.gain.linearRampToValueAtTime(v*0.85,t+d*0.5);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g).connect(masterGain);o.start(t);o.stop(t+d+0.02);}
function musK(t){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.connect(g).connect(masterGain);o.start(t);o.stop(t+0.13);}
function musH(t){const buf=audioCtx.createBuffer(1,0.04*audioCtx.sampleRate,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.3;const s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=buf;g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.04);s.connect(g).connect(masterGain);s.start(t);}
function musLoop(start){for(let c=0;c<4;c++){const cs=start+c*COMPAS;musN(cs,BASS[c],COMPAS*0.95,'triangle',0.16);for(let n=0;n<8;n++)musN(cs+n*SIXTEENTH,MELODY[c][n],SIXTEENTH*0.85,'square',0.07);for(let n=0;n<4;n++)musN(cs+n*BEAT,HARM[c][n],BEAT*0.85,'square',0.04);for(let n=0;n<4;n++){if(n===0||n===2)musK(cs+n*BEAT);musH(cs+n*BEAT+BEAT*0.5);}}}
function musTick(){if(!musicaRunning)return;while(nextLoopTime<audioCtx.currentTime+0.1){musLoop(nextLoopTime);nextLoopTime+=LOOP_LEN;}schedId=setTimeout(musTick,80);}
async function startMusic(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=0.2;masterGain.connect(audioCtx.destination);}if(audioCtx.state==='suspended')await audioCtx.resume();musicaRunning=true;masterGain.gain.cancelScheduledValues(audioCtx.currentTime);masterGain.gain.setValueAtTime(masterGain.gain.value,audioCtx.currentTime);masterGain.gain.linearRampToValueAtTime(0.2,audioCtx.currentTime+0.4);nextLoopTime=audioCtx.currentTime+0.05;musTick();refreshAudio();}
function stopMusic(){musicaRunning=false;if(schedId)clearTimeout(schedId);if(masterGain){masterGain.gain.cancelScheduledValues(audioCtx.currentTime);masterGain.gain.setValueAtTime(masterGain.gain.value,audioCtx.currentTime);masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.3);}refreshAudio();}
function refreshAudio(){const b=document.getElementById('audio-toggle');if(musicaRunning){b.classList.add('playing');b.textContent='♪';}else{b.classList.remove('playing');b.textContent='🎵';}}
document.getElementById('audio-toggle').addEventListener('click',async()=>{if(musicaRunning){stopMusic();try{localStorage.setItem(MUSIC_KEY,'off');}catch(e){}}else{await startMusic();try{localStorage.setItem(MUSIC_KEY,'on');}catch(e){}}});
(function(){let pref=null;try{pref=localStorage.getItem(MUSIC_KEY);}catch(e){}if(pref!=='on')return;const trigger=async()=>{document.removeEventListener('click',trigger,true);document.removeEventListener('keydown',trigger,true);try{await startMusic();}catch(e){}};document.addEventListener('click',trigger,true);document.addEventListener('keydown',trigger,true);})();

/* SFX cortos */
let sfxCtx = null;
function getSfx() { if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)(); if (sfxCtx.state === 'suspended') sfxCtx.resume(); return sfxCtx; }
function tone(f, d=0.08, type='square', v=0.05) {
  const ctx = getSfx();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
  o.connect(g).connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + d);
}
function playSfx(kind) {
  if (kind === 'click') tone(420, 0.04);
  if (kind === 'pop') tone(660, 0.1);
  if (kind === 'correct') { tone(523, 0.08); setTimeout(() => tone(659, 0.12), 80); }
  if (kind === 'wrong') tone(220, 0.18, 'sawtooth', 0.04);
  if (kind === 'build') { tone(330, 0.05); setTimeout(() => tone(440, 0.08), 60); }
  if (kind === 'hit') { tone(180, 0.06, 'sawtooth', 0.06); }
  if (kind === 'crowd') { [220, 330, 440, 550].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'square', 0.05), i * 60)); }
  if (kind === 'victory') [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.15), i * 100));
}

   ═══════════════════════════════════════════════════════════════════════ */

(function init() {
  loadGame();
  // si reanuda en una escena rara que no es coherente, volver a title
  if (!SCENES[game.scene]) game.scene = 'title';
  render();
})();
